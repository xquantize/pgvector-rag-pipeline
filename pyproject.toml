[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgvector-rag-pipeline"
version = "0.1.0"
description = "RAG over Postgres/pgvector, with an evaluation harness."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pypdf>=4.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Local Hugging Face embeddings (no API key). Install when EMBEDDING_PROVIDER=huggingface.
huggingface = ["sentence-transformers>=3.0", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
